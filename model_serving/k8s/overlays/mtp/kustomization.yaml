apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../baseline

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: vllm-cpu
    patch: |-
      - op: replace
        path: /spec/template/metadata/labels/serving-variant
        value: mtp
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --speculative-config
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: '{"method":"qwen3_next_mtp","num_speculative_tokens":2}'
