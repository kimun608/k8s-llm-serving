apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../mtp-cpu8

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: vllm-cpu
    patch: |-
      - op: replace
        path: /spec/template/metadata/labels/serving-variant
        value: mtp-seq24-cpu8
      - op: test
        path: /spec/template/spec/containers/0/args/12
        value: --max-num-seqs
      - op: test
        path: /spec/template/spec/containers/0/args/13
        value: "20"
      - op: replace
        path: /spec/template/spec/containers/0/args/13
        value: "24"
