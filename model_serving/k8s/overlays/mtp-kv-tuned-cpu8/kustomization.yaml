apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../mtp-kv-tuned

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: vllm-cpu
    patch: |-
      - op: replace
        path: /spec/template/metadata/labels/serving-variant
        value: mtp-kv-tuned-cpu8
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "8"
