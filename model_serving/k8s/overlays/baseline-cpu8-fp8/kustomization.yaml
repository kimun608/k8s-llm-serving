apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../baseline-cpu8

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: vllm-cpu
    patch: |-
      - op: replace
        path: /spec/template/metadata/labels/serving-variant
        value: baseline-cpu8-fp8
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kv-cache-dtype
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: fp8
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --calculate-kv-scales
