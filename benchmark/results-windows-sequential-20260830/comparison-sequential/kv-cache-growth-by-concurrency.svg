<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="kv-growth-title kv-growth-desc">
<title id="kv-growth-title">Concurrency versus peak KV cache occupancy</title>
<desc id="kv-growth-desc">Sampled peak KV-cache occupancy for CPU8 MTP2 max-num-seqs 20. S2 · KV512: C1 98.8 MiB (19.3 percent), C2 188.6 MiB (36.8 percent), C5 467.1 MiB (91.2 percent), C10 467.1 MiB (91.2 percent), C20 467.1 MiB (91.2 percent), C50 467.1 MiB (91.2 percent), C100 467.1 MiB (91.2 percent); S3 · KV768: C1 98.2 MiB (12.8 percent), C2 187.5 MiB (24.4 percent), C5 464.4 MiB (60.5 percent), C10 741.2 MiB (96.5 percent), C20 741.2 MiB (96.5 percent), C50 741.2 MiB (96.5 percent), C100 741.2 MiB (96.5 percent); S4 · 8-bit KV768: C1 80.0 MiB (10.4 percent), C2 160.0 MiB (20.8 percent), C5 400.0 MiB (52.1 percent), C10 720.0 MiB (93.8 percent), C20 720.0 MiB (93.8 percent), C50 720.0 MiB (93.8 percent), C100 720.0 MiB (93.8 percent). Budget-equivalent MiB equals configured KV budget multiplied by the one-second sampled peak used-block percentage; it is not Pod RSS.</desc>
