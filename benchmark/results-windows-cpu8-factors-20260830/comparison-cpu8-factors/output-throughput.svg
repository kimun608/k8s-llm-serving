<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
<title id="title">Windows CPU8 independent-factor output throughput</title>
<desc id="desc">Windows CPU8 independent-factor output throughput at client concurrencies 1, 2, 5, 10, 20, 50 and 100.</desc>
