<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="890" viewBox="0 0 1280 890" role="img" aria-labelledby="kv-growth-title kv-growth-desc">
<title id="kv-growth-title">Concurrency versus peak KV cache occupancy</title>
<desc id="kv-growth-desc">CPU8 MTP2 max-num-seqs 20. KV budget 512MiB: C1 98.8 MiB (19.3 percent), C2 188.6 MiB (36.8 percent), C5 467.1 MiB (91.2 percent), C10 467.1 MiB (91.2 percent), C20 467.1 MiB (91.2 percent), C50 467.1 MiB (91.2 percent), C100 467.1 MiB (91.2 percent); KV budget 768MiB: C1 98.2 MiB (12.8 percent), C2 187.5 MiB (24.4 percent), C5 464.4 MiB (60.5 percent), C10 732.3 MiB (95.3 percent), C20 741.2 MiB (96.5 percent), C50 741.2 MiB (96.5 percent), C100 741.2 MiB (96.5 percent). Observed plateau starts: KV budget 512MiB C=5, KV budget 768MiB C=20. MiB values are configured budget multiplied by the one-second sampled used-block fraction, not RSS.</desc>
