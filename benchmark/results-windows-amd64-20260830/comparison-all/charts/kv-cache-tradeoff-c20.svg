<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="kv-title kv-desc">
<title id="kv-title">KV cache byte-budget trade-off at concurrency 20</title>
<desc id="kv-desc">With CPU8, MTP2 and max-num-seqs 20 fixed, increasing the KV cache from 512 to 768 MiB changed peak running requests from 5 to 8 and peak waiting requests from 15 to 12. Output throughput changed +11.6 percent, TPOT p95 changed +52.2 percent, and E2E p95 changed -4.2 percent. Running and waiting are independently sampled peaks.</desc>
<rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker></defs>
<text x="640" y="38" text-anchor="middle" font-size="24" font-family="sans-serif" font-weight="600">KV cache 증량의 capacity–performance trade-off</text>
<text x="640" y="64" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#4b5563">Controlled A/B: CPU 8 · MTP2 · max-num-seqs 20 고정 · concurrency 20</text>
<rect x="45" y="92" width="330" height="485" fill="none" stroke="#d1d5db"/>
<rect x="420" y="92" width="350" height="485" fill="none" stroke="#d1d5db"/>
<rect x="815" y="92" width="420" height="485" fill="none" stroke="#d1d5db"/>
<text x="67" y="124" font-size="18" font-family="sans-serif" font-weight="600">1. 변경한 값: KV byte budget</text>
<text x="67" y="153" font-size="15" font-family="sans-serif" fill="#4b5563">KV512 (reference)</text>
<rect x="67" y="165" width="146.7" height="35" fill="#2563eb"/>
<text x="221.7" y="188" font-size="15" font-family="sans-serif" fill="#111827">512 MiB</text>
<text x="67" y="233" font-size="15" font-family="sans-serif" fill="#4b5563">KV768 (increased)</text>
<rect x="67" y="245" width="220" height="35" fill="#7c3aed"/>
<text x="295" y="268" font-size="15" font-family="sans-serif" fill="#111827">768 MiB</text>
<text x="67" y="322" font-size="22" font-family="sans-serif" font-weight="600" fill="#7c3aed">+50% bytes</text>
<line x1="67" y1="345" x2="353" y2="345" stroke="#e5e7eb"/>
<text x="67" y="378" font-size="15" font-family="sans-serif" fill="#111827">고정 조건</text>
<text x="67" y="405" font-size="15" font-family="sans-serif" fill="#4b5563">• model / BF16 weights</text>
<text x="67" y="430" font-size="15" font-family="sans-serif" fill="#4b5563">• CPU limit 8 · MTP2</text>
<text x="67" y="455" font-size="15" font-family="sans-serif" fill="#4b5563">• max-num-seqs 20</text>
<text x="67" y="480" font-size="15" font-family="sans-serif" fill="#4b5563">• 동일 100 prompts / 출력 tokens</text>
<text x="442" y="124" font-size="18" font-family="sans-serif" font-weight="600">2. 관찰: scheduler peak 변화</text>
<text x="442" y="164" font-size="15" font-family="sans-serif" font-weight="600" fill="#059669">Peak running requests</text>
<text x="442" y="196" font-size="14" font-family="sans-serif" fill="#4b5563">512</text>
<rect x="482" y="181" width="70.0" height="21" fill="#059669"/>
<text x="560.0" y="197" font-size="14" font-family="sans-serif">5</text>
<text x="442" y="230" font-size="14" font-family="sans-serif" fill="#4b5563">768</text>
<rect x="482" y="215" width="112.0" height="21" fill="#059669"/>
<text x="602.0" y="231" font-size="14" font-family="sans-serif">8</text>
<text x="442" y="280" font-size="15" font-family="sans-serif" font-weight="600" fill="#ea580c">Peak waiting requests</text>
<text x="442" y="312" font-size="14" font-family="sans-serif" fill="#4b5563">512</text>
<rect x="482" y="297" width="210.0" height="21" fill="#ea580c"/>
<text x="700.0" y="313" font-size="14" font-family="sans-serif">15</text>
<text x="442" y="346" font-size="14" font-family="sans-serif" fill="#4b5563">768</text>
<rect x="482" y="331" width="168.0" height="21" fill="#ea580c"/>
<text x="658.0" y="347" font-size="14" font-family="sans-serif">12</text>
<text x="442" y="400" font-size="20" font-family="sans-serif" font-weight="600" fill="#059669">running 5 → 8</text>
<text x="442" y="431" font-size="20" font-family="sans-serif" font-weight="600" fill="#ea580c">waiting 15 → 12</text>
<text x="442" y="480" font-size="14" font-family="sans-serif" fill="#4b5563">※ run/wait는 1초 metric의 독립 peak</text>
<text x="442" y="503" font-size="14" font-family="sans-serif" fill="#4b5563">값이며 같은 시점의 합이 아니다.</text>
<text x="837" y="124" font-size="18" font-family="sans-serif" font-weight="600">3. 관찰: 성능 지표 변화</text>
<rect x="837" y="141" width="13" height="13" fill="#2563eb"/><text x="858" y="153" font-size="14" font-family="sans-serif" fill="#4b5563">KV512</text>
<rect x="925" y="141" width="13" height="13" fill="#7c3aed"/><text x="946" y="153" font-size="14" font-family="sans-serif" fill="#4b5563">KV768</text>
<text x="837" y="190" font-size="15" font-family="sans-serif" font-weight="600">Output throughput <tspan fill="#4b5563" font-weight="400">(tok/s)</tspan></text>
<text x="1211" y="190" text-anchor="end" font-size="15" font-family="sans-serif" font-weight="600" fill="#059669">+11.6%</text>
<line x1="875" y1="218" x2="1120" y2="218" stroke="#e5e7eb"/>
<text x="837" y="224" font-size="14" font-family="sans-serif" fill="#4b5563">512</text>
<rect x="875" y="207" width="203.2" height="18" fill="#2563eb"/>
<text x="1085.2" y="221" font-size="14" font-family="sans-serif" fill="#111827">72.13</text>
<line x1="875" y1="247" x2="1120" y2="247" stroke="#e5e7eb"/>
<text x="837" y="253" font-size="14" font-family="sans-serif" fill="#4b5563">768</text>
<rect x="875" y="236" width="226.9" height="18" fill="#7c3aed"/>
<text x="1108.9" y="250" font-size="14" font-family="sans-serif" fill="#111827">80.52</text>
<text x="837" y="312" font-size="15" font-family="sans-serif" font-weight="600">TPOT p95 <tspan fill="#4b5563" font-weight="400">(ms/token)</tspan></text>
<text x="1211" y="312" text-anchor="end" font-size="15" font-family="sans-serif" font-weight="600" fill="#b91c1c">+52.2%</text>
<line x1="875" y1="340" x2="1120" y2="340" stroke="#e5e7eb"/>
<text x="837" y="346" font-size="14" font-family="sans-serif" fill="#4b5563">512</text>
<rect x="875" y="329" width="149.1" height="18" fill="#2563eb"/>
<text x="1031.1" y="343" font-size="14" font-family="sans-serif" fill="#111827">78.23</text>
<line x1="875" y1="369" x2="1120" y2="369" stroke="#e5e7eb"/>
<text x="837" y="375" font-size="14" font-family="sans-serif" fill="#4b5563">768</text>
<rect x="875" y="358" width="226.9" height="18" fill="#7c3aed"/>
<text x="1108.9" y="372" font-size="14" font-family="sans-serif" fill="#111827">119.06</text>
<text x="837" y="434" font-size="15" font-family="sans-serif" font-weight="600">E2E p95 <tspan fill="#4b5563" font-weight="400">(seconds)</tspan></text>
<text x="1211" y="434" text-anchor="end" font-size="15" font-family="sans-serif" font-weight="600" fill="#059669">-4.2%</text>
<line x1="875" y1="462" x2="1120" y2="462" stroke="#e5e7eb"/>
<text x="837" y="468" font-size="14" font-family="sans-serif" fill="#4b5563">512</text>
<rect x="875" y="451" width="226.9" height="18" fill="#2563eb"/>
<text x="1108.9" y="465" font-size="14" font-family="sans-serif" fill="#111827">18.99</text>
<line x1="875" y1="491" x2="1120" y2="491" stroke="#e5e7eb"/>
<text x="837" y="497" font-size="14" font-family="sans-serif" fill="#4b5563">768</text>
<rect x="875" y="480" width="217.4" height="18" fill="#7c3aed"/>
<text x="1099.4" y="494" font-size="14" font-family="sans-serif" fill="#111827">18.20</text>
<line x1="375" y1="334" x2="409" y2="334" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="770" y1="334" x2="804" y2="334" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="640" y="615" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="600">결론: KV capacity 변화 ≠ per-token speed 가속 보장</text>
<text x="640" y="646" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#374151">같은 CPU8에서 scheduler peak와 throughput·TPOT·E2E가 함께 변했다.</text>
<text x="640" y="673" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#4b5563">KV 이외의 CPU-side 자원 압력과 일치하지만, 정확한 원인은 profiler로 추가 분해해야 한다.</text>
</svg>
